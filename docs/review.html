## 범위

원본 `legacy/20261030-IFMS터널링유틸/src/ifms_tunnel.py`의 `2026-10-30c` 판, 기존 통합 시험, 빌드 도구와 README를 검토했습니다. `legacy/`는 수정하지 않고 루트 패키지로 복사했습니다. 원본 문서의 과거 시험 통과 기록은 이번 환경의 시험 결과와 구분합니다.

## 발견·조치

| 우선순위 | 원본 근거 | 문제 | 새 코드 조치 |
|---|---|---|---|
| P2 | `Engine.start/stop/_connect`, 원본 450·459·478행 | 접속 중 중지·서버 교체 후 이전 접속이 성공하면 오래된 Transport를 등록할 수 있음 | 세대 번호·잠금으로 늦은 성공/실패를 폐기, 회귀 시험 추가 |
| P2 | `Engine._keepalive_probe`, 원본 530행 | 이전 연결의 늦은 응답이 현재 연결의 상태를 갱신할 수 있음 | 현재 Transport와 동일할 때만 갱신 |
| P2 | `Forwarder._handle`, 원본 697행 | 채널 개설 대기 중 중지하면 stop 시점에 등록되지 않은 채널이 뒤늦게 남을 수 있음 | 개설 전·등록 시 중지 여부를 확인하고 소켓·채널 정리 |
| P2 | `read_config`, 원본 228행 / `Engine._run`, 원본 539행 | 포트 범위·중복·keepalive 값이 검증되지 않아 서비스 루프 또는 supervisor가 중단될 수 있음 | 실행 전 JSON 구조·값 검증, 잘못된 설정은 이전 설정 유지 |
| P3 | 원본 `build.py`·상대 경로 실행 | 개발·배포·로그·개인 설정과 원본 소스가 섞이고 재실행이 단일 파일 경로에 결합됨 | 패키지·진입점·데이터·시험·시각별 빌드 출력 분리 |

회귀 시험은 `tests/test_lifecycle.py`와 `tests/test_configuration.py`에 있습니다. 기존 중계 시험은 `tests/integration_engine.py`로 이관했습니다.

## 기능 보존

- 기존 IFMS 서버·표준 터널 목록, 이름 자연 정렬, 망별 표시 설정을 유지합니다.
- 비밀번호·키 인증, 호스트 키 대조, DPAPI, GUI·headless·서비스 기능을 유지합니다.
- 제품·서비스·Run 값·뮤텍스·설정 이름을 캡틴 터널링으로 분리합니다.
- 원본 운영 설정·암호·로그는 자동 이관하지 않습니다.

 const source=new TextDecoder('utf-8').decode(Uint8Array.from(atob(byId('guide-source').textContent.trim()),c=>c.charCodeAt(0)));
 const lines=source.replace(/\r\n?/g,'\n').split('\n');let fenced=false;const groups=[];let current={title:'개요',lines:[]};let removedTitle=false;
 for(const line of lines){if(/^```/.test(line))fenced=!fenced;if(!fenced&&!removedTitle&&/^#\s/.test(line)){removedTitle=true;continue;}if(!fenced&&/^##\s/.test(line)){if(current.lines.some(s=>s.trim()))groups.push(current);current={title:line.slice(3).trim(),lines:[]};}else current.lines.push(line);}
 if(current.lines.some(s=>s.trim())||!groups.length)groups.push(current);
 groups.forEach((g,n)=>{const id='section-'+(n+1);const tab=document.createElement('button');tab.type='button';tab.className='tab';tab.id='tab-'+id;tab.setAttribute('role','tab');tab.setAttribute('aria-controls',id);tab.textContent=g.title;tab.addEventListener('click',()=>activate(id));byId('tabs').append(tab);
  const section=document.createElement('section');section.className='section';section.id=id;section.setAttribute('role','tabpanel');section.setAttribute('aria-labelledby',tab.id);section.innerHTML='<div class="section-layout no-sidebar"><div class="content"><h2>'+inline(g.title)+'</h2>'+renderMarkdown(g.lines.join('\n'))+'</div></div>';
  const sub=section.querySelectorAll('.content h3');if(sub.length>=2){const aside=document.createElement('nav');aside.className='on-page';aside.setAttribute('aria-label','이 섹션의 목차');aside.innerHTML='<strong>On this page</strong>'+Array.from(sub).map(h=>'<a href="#'+encodeURIComponent(h.id)+'">'+esc(h.textContent)+'</a>').join('');const layout=section.firstElementChild;layout.classList.remove('no-sidebar');layout.prepend(aside);}byId('main').append(section);
 });
 document.querySelectorAll('.copy').forEach(button=>button.addEventListener('click',async()=>{const text=button.parentElement.querySelector('code').textContent;try{await navigator.clipboard.writeText(text);button.textContent='✓ 복사됨';}catch(e){const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();const copied=document.execCommand('copy');area.remove();button.textContent=copied?'✓ 복사됨':'복사 불가';}setTimeout(()=>button.textContent='📋 복사',1500);}));
 activateFromHash();
}
function activate(id,update=true){const section=byId(id);if(!section)return;document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s===section));document.querySelectorAll('.tab').forEach(t=>{const on=t.getAttribute('aria-controls')===id;t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1;});if(update)history.replaceState(null,'','#'+id);}
function activateFromHash(){let id='';try{id=decodeURIComponent(location.hash.slice(1));}catch(e){}const target=byId(id);const section=target?.closest('.section')||document.querySelector('.section');if(section){activate(section.id,false);if(target&&target!==section)requestAnimationFrame(()=>target.scrollIntoView());}}
window.addEventListener('hashchange',activateFromHash);
byId('tabs').addEventListener('keydown',e=>{const tabs=Array.from(document.querySelectorAll('.tab'));let n=tabs.indexOf(document.activeElement);if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)||n<0)return;e.preventDefault();n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(n+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[n].focus();tabs[n].click();});
function isDark(){return root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;}
function fontSize(){return Math.round((parseFloat(root.style.getPropertyValue('--fz'))||1)*15);}
function savePref(key,value){try{localStorage.setItem(prefKey+key,String(value));}catch(e){}}
function syncPrefs(){byId('themeToggle').checked=isDark();const skin=root.dataset.skin||'green';document.querySelectorAll('.skin-dot').forEach(s=>{s.checked=s.value===skin;if(s.checked)byId('skinName').textContent=s.getAttribute('aria-label');});const f=fontSize();byId('fontVal').textContent=f;byId('fontDown').disabled=f<=12;byId('fontUp').disabled=f>=20;}
function togglePrefs(open){const panel=byId('prefsPanel');open=open===undefined?panel.hidden:open;panel.hidden=!open;byId('prefsBtn').setAttribute('aria-expanded',String(open));if(open)byId('themeToggle').focus();}
byId('prefsBtn').addEventListener('click',()=>togglePrefs());
byId('themeToggle').addEventListener('change',e=>{root.dataset.theme=e.target.checked?'dark':'light';savePref('theme',root.dataset.theme);syncPrefs();});
document.querySelectorAll('.skin-dot').forEach(s=>s.addEventListener('change',()=>{if(s.value==='green')delete root.dataset.skin;else root.dataset.skin=s.value;savePref('skin',s.value);syncPrefs();}));
function stepFont(delta){const f=Math.max(12,Math.min(20,fontSize()+delta));root.style.setProperty('--fz',f/15);savePref('font',f);syncPrefs();}
byId('fontDown').addEventListener('click',()=>stepFont(-1));byId('fontUp').addEventListener('click',()=>stepFont(1));
byId('resetBtn').addEventListener('click',()=>{delete root.dataset.theme;delete root.dataset.skin;root.style.removeProperty('--fz');try{['theme','skin','font'].forEach(k=>localStorage.removeItem(prefKey+k));}catch(e){}syncPrefs();});
byId('printBtn').addEventListener('click',()=>window.print());
document.addEventListener('click',e=>{if(!byId('prefsPanel').hidden&&!byId('prefsPanel').contains(e.target)&&!byId('prefsBtn').contains(e.target)){togglePrefs(false);byId('prefsBtn').focus();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!byId('prefsPanel').hidden){togglePrefs(false);byId('prefsBtn').focus();}});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',syncPrefs);
renderGuide();syncPrefs();document.documentElement.dataset.guideReady='true';
</script>
</body>
